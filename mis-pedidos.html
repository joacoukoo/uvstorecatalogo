<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis Pedidos — UV Store GT</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Revisá el estado de tus pedidos, tus pagos y tu rango de coleccionista.">
  <meta property="og:title" content="Mis Pedidos — UV Store GT">
  <meta property="og:description" content="Revisá el estado de tus pedidos, tus pagos y tu rango de coleccionista 🏆">
  <meta property="og:image" content="https://uvstore.shop/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1200">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="UV Store GT">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #0f1117; color: #e8eaf0; min-height: 100vh; padding: 0 0 48px; }
    .header { padding: 16px 16px 14px; border-bottom: 1px solid #2a2d3a; margin-bottom: 16px; }
    .header-brand { font-size: 12px; font-weight: 700; letter-spacing: .08em;
                    text-transform: uppercase; color: #7c3aed; margin-bottom: 4px; }
    .header-name { font-size: 20px; font-weight: 700; color: #fff; }
    .container { max-width: 600px; margin: 0 auto; padding: 0 12px; }
    .rango { display: flex; align-items: center; gap: 14px; background: #1a1d27;
             border: 1px solid var(--rc, #2a2d3a); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
    .rango-info { flex: 1; min-width: 0; }
    .rango-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #6b7280; }
    .rango-nombre { font-size: 20px; font-weight: 800; color: var(--rc, #fff); margin: 1px 0 8px; }
    .rango-bar { height: 6px; background: #12141e; border-radius: 3px; overflow: hidden; }
    .rango-fill { height: 100%; background: var(--rc, #7c3aed); border-radius: 3px; }
    .rango-next { font-size: 11px; color: #9ca3af; margin-top: 5px; }
    .card { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 10px;
            padding: 14px 16px; margin-bottom: 12px; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
    .figura { font-size: 15px; font-weight: 600; color: #fff; }
    .marca { font-size: 11px; color: #6b7280; margin-top: 2px; }
    .estado { display: inline-flex; align-items: center; flex-shrink: 0;
              font-size: 10px; font-weight: 700; letter-spacing: .05em;
              text-transform: uppercase; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
    .estado-proceso  { background: rgba(99,102,241,.15); color: #a5b4fc; }
    .estado-pagada   { background: rgba(16,185,129,.15); color: #6ee7b7; }
    .estado-saldo    { background: rgba(251,191,36,.15); color: #fcd34d; }
    .estado-cancelada{ background: rgba(239,68,68,.15);  color: #fca5a5; }
    .estado-entregada{ background: rgba(16,185,129,.2);  color: #34d399; }
    .montos { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 0; }
    .monto-item { text-align: center; background: #12141e; border-radius: 8px; padding: 8px 4px; }
    .monto-label { font-size: 9px; color: #6b7280; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
    .monto-val { font-size: 15px; font-weight: 700; color: #fff; }
    .monto-val.green { color: #34d399; }
    .monto-val.red   { color: #f87171; }
    .fecha-row { font-size: 11px; color: #6b7280; margin-bottom: 10px; }
    details { margin-top: 10px; border-top: 1px solid #2a2d3a; padding-top: 8px; }
    summary { font-size: 11px; font-weight: 600; color: #6b7280; text-transform: uppercase;
              letter-spacing: .05em; cursor: pointer; list-style: none; display: flex;
              align-items: center; gap: 6px; user-select: none; }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: '▶'; font-size: 8px; transition: transform .15s; }
    details[open] summary::before { transform: rotate(90deg); }
    .pago-row { display: flex; justify-content: space-between; align-items: center;
                padding: 6px 0; border-top: 1px solid #1e2130; font-size: 12px; margin-top: 6px; }
    .pago-info  { color: #9ca3af; }
    .pago-monto { font-weight: 600; color: #34d399; }
    .filtros { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px;
               scrollbar-width: none; }
    .filtros::-webkit-scrollbar { display: none; }
    .filtro { flex-shrink: 0; background: #1a1d27; border: 1px solid #2a2d3a; color: #9ca3af;
              font: inherit; font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 20px; cursor: pointer; }
    .filtro.activo { background: #7c3aed; border-color: #7c3aed; color: #fff; }
    .filtro-n { opacity: .7; margin-left: 3px; }
    .btn-abono { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px;
                 padding: 10px; border-radius: 8px; background: rgba(37,211,102,.12); border: 1px solid rgba(37,211,102,.35);
                 color: #4ade80; font-size: 13px; font-weight: 700; text-decoration: none; }
    .btn-abono:active { background: rgba(37,211,102,.22); }
    .empty   { text-align: center; padding: 60px 20px; color: #6b7280; }
    .error   { text-align: center; padding: 60px 20px; color: #f87171; }
    .loading { text-align: center; padding: 60px 20px; color: #6b7280; font-size: 14px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading" id="loading">Cargando tus pedidos...</div>
    <div id="content" style="display:none">
      <div class="header container">
        <div class="header-brand">UV Store GT</div>
        <div class="header-name" id="clienteNombre"></div>
      </div>
      <div class="container">
        <div class="rango" id="rango" style="display:none"></div>
        <div class="filtros" id="filtros" style="display:none"></div>
        <div id="ordenes"></div>
      </div>
    </div>
    <div class="error" id="error" style="display:none"></div>
  </div>

  <script src="/rangos.js?v=20261024"></script>
  <script>
    const token = new URLSearchParams(location.search).get('t');
    const WA_TIENDA = '50230261622';
    let ORDENES = [], CLIENTE = '', FILTRO = 'todas';

    function saldoDe(o) {
      const abonado = (o.pagos || []).reduce((s, p) => s + (p.monto || 0), 0);
      return (o.precio_venta_gtq || 0) - abonado;
    }
    // Cada figura cae en una sola categoría: cruza si está pagada y si está entregada.
    const CATEGORIAS = [
      { id: 'por-pagar',    nombre: 'Por pagar',             etiqueta: 'Por pagar',             clase: 'estado-proceso' },
      { id: 'pagada',       nombre: 'Pagadas sin entregar',  etiqueta: 'Pagada · sin entregar', clase: 'estado-pagada' },
      { id: 'entr-saldo',   nombre: 'Entregadas con saldo',  etiqueta: 'Entregada · con saldo', clase: 'estado-saldo' },
      { id: 'completa',     nombre: 'Entregadas y pagadas',  etiqueta: '✓ Entregada y pagada',  clase: 'estado-entregada' },
      { id: 'cancelada',    nombre: 'Canceladas',            etiqueta: 'Cancelada',             clase: 'estado-cancelada' },
    ];
    function categoriaDe(o) {
      if (o.estado === 'cancelada') return CATEGORIAS[4];
      const pagada = saldoDe(o) <= 0;
      if (o.entregado) return pagada ? CATEGORIAS[3] : CATEGORIAS[2];
      return pagada ? CATEGORIAS[1] : CATEGORIAS[0];
    }
    const FILTROS = [
      { id: 'todas', nombre: 'Todas', fn: o => true, siempre: true },
      ...CATEGORIAS.map(c => ({ id: c.id, nombre: c.nombre, fn: o => categoriaDe(o) === c })),
    ];

    function linkAbono(o, saldo) {
      const msg = `Hola UV Store 👋 Soy ${CLIENTE}. Quiero hacer un abono a mi figura *${o.producto || ''}*`
        + ` (saldo pendiente ${fmtQ(saldo)}). ¿Me pasan los datos para transferencia o depósito?`;
      return `https://wa.me/${WA_TIENDA}?text=${encodeURIComponent(msg)}`;
    }

    function fmtQ(n) {
      return 'Q' + Number(n || 0).toLocaleString('es-GT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function fmtDate(dt) {
      if (!dt) return '';
      return new Date(dt).toLocaleDateString('es-GT', { day: '2-digit', month: 'short', year: 'numeric' });
    }
    function estadoClass(o) { return categoriaDe(o).clase; }
    function estadoLabel(o) { return categoriaDe(o).etiqueta; }
    function renderOrden(o) {
      const pagos = o.pagos || [];
      const abonado = pagos.reduce((s, p) => s + (p.monto || 0), 0);
      const saldo = (o.precio_venta_gtq || 0) - abonado;
      const pagosHtml = pagos.length === 0 ? '' : `
        <details>
          <summary>Pagos registrados (${pagos.length})</summary>
          ${pagos.map(p => `
            <div class="pago-row">
              <span class="pago-info">${p.fecha || ''} · ${p.metodo || ''}</span>
              <span class="pago-monto">${fmtQ(p.monto)}</span>
            </div>`).join('')}
        </details>`;
      return `
        <div class="card">
          <div class="card-top">
            <div>
              <div class="figura">${o.producto || ''}</div>
              ${o.marca ? `<div class="marca">${o.marca}</div>` : ''}
            </div>
            <span class="estado ${estadoClass(o)}">${estadoLabel(o)}</span>
          </div>
          <div class="fecha-row">${fmtDate(o.created_at)}</div>
          <div class="montos">
            <div class="monto-item">
              <div class="monto-label">Precio</div>
              <div class="monto-val">${fmtQ(o.precio_venta_gtq)}</div>
            </div>
            <div class="monto-item">
              <div class="monto-label">Abonado</div>
              <div class="monto-val green">${fmtQ(abonado)}</div>
            </div>
            <div class="monto-item">
              <div class="monto-label">Saldo</div>
              <div class="monto-val ${saldo > 0 ? 'red' : 'green'}">${fmtQ(saldo)}</div>
            </div>
          </div>
          ${o.estado !== 'cancelada' && saldo > 0 ? `
            <a class="btn-abono" href="${linkAbono(o, saldo)}" target="_blank" rel="noopener">💬 Quiero hacer un abono</a>` : ''}
          ${pagosHtml}
        </div>`;
    }

    function renderRango(ordenes) {
      const total = ordenes
        .filter(o => o.estado !== 'cancelada')
        .reduce((s, o) => s + (o.precio_venta_gtq || 0), 0);
      const r = rangoPorMonto(total);
      const prog = progresoRango(total);
      const el = document.getElementById('rango');
      el.style.setProperty('--rc', r.c1);
      el.innerHTML = `
        ${insigniaRango(r, 56)}
        <div class="rango-info">
          <div class="rango-label">Tu rango de coleccionista</div>
          <div class="rango-nombre">${r.nombre}</div>
          ${prog ? `
            <div class="rango-bar"><div class="rango-fill" style="width:${prog.pct.toFixed(0)}%"></div></div>
            <div class="rango-next">Próximo rango: ${prog.siguiente.nombre}</div>`
          : `<div class="rango-next">Llegaste al rango máximo 👑</div>`}
        </div>`;
      el.style.display = '';
    }

    function renderFiltros() {
      const el = document.getElementById('filtros');
      el.innerHTML = FILTROS
        .map(f => ({ ...f, n: ORDENES.filter(f.fn).length }))
        .filter(f => f.siempre || f.n > 0 || f.id === FILTRO)
        .map(f => `<button class="filtro${f.id === FILTRO ? ' activo' : ''}" data-f="${f.id}">${f.nombre}<span class="filtro-n">${f.n}</span></button>`)
        .join('');
      el.style.display = '';
    }

    function renderOrdenes() {
      const f = FILTROS.find(x => x.id === FILTRO);
      const lista = ORDENES.filter(f.fn);
      document.getElementById('ordenes').innerHTML = lista.length
        ? lista.map(renderOrden).join('')
        : '<div class="empty">No hay pedidos en esta categoría.</div>';
    }

    document.getElementById('filtros').addEventListener('click', e => {
      const b = e.target.closest('.filtro');
      if (!b) return;
      FILTRO = b.dataset.f;
      renderFiltros();
      renderOrdenes();
    });

    async function load() {
      if (!token) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = '';
        document.getElementById('error').textContent = 'Link inválido. Pedile a UV Store el link correcto.';
        return;
      }
      try {
        const res = await fetch('/api/mis-pedidos?t=' + encodeURIComponent(token));
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = '';
        document.getElementById('clienteNombre').textContent = 'Hola, ' + data.cliente.nombre;

        if ((data.ordenes || []).length) renderRango(data.ordenes);

        ORDENES = data.ordenes || [];
        CLIENTE = data.cliente.nombre || '';
        if (!ORDENES.length) {
          document.getElementById('ordenes').innerHTML = '<div class="empty">No tenés pedidos registrados aún.</div>';
        } else {
          renderFiltros();
          renderOrdenes();
        }
      } catch(e) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = '';
        document.getElementById('error').textContent = 'No se pudo cargar tu historial. Intentá de nuevo más tarde.';
      }
    }

    load();
  </script>
</body>
</html>
